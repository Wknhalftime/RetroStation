[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[project]
name = "retrostation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.134",
    "uvicorn[standard]",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "huey>=2.6",
    "mutagen>=1.47",
    "sentence-transformers>=3.0",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "structlog",
    "pydantic-settings",
    "pgvector",
    "chardet",
    "unidecode>=1.3",
    "python-multipart>=0.0.22",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-n logical"
# Per-test hang ceiling. Catches deadlocks (e.g. a runaway TRUNCATE blocked on
# a leaked ACCESS EXCLUSIVE lock) before they consume the whole CI job. Use
# @pytest.mark.timeout(N) on individual tests that legitimately need longer.
timeout = 60
timeout_method = "thread"
markers = [
    "integration: tests requiring a real PostgreSQL database",
    "slow: tests that take >1s (large fixture sets, network, etc.)",
]

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = false

[[tool.mypy.overrides]]
# mutagen ships no py.typed; its stubs have unresolved exports.
# Relax untyped-call checks in the fixture generator script only.
module = "tests.fixtures.create_audio_fixtures"
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["backend"]
parallel = true

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
