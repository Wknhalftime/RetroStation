# AGC output-target step: agc.liq alone at -18 LUFS; idle = target - (-18 LUFS item-gain level).
id = "agc-target-18"
version = 1
backend = "liquidsoap"
chain = "../../chains/agc_only.liq"
description = "agc.liq alone, target -18 LUFS, idle 0.0 dB, +-10 dB, gate -33."
[params]
target = -18.0
idle = 0.0
threshold = -33.0
gain_min = -10.0
gain_max = 10.0
[gauge_limits]
agc_gain = [-10.0, 10.0]
