# AGC timing step: agc.liq alone at R10's -18 LUFS. Song-level: release 0.3 dB/s, 6 dB window at 0.05 dB/s, 30 s detector, attack 1 dB/s.
id = "agc-timing-t4"
version = 1
backend = "liquidsoap"
chain = "../../chains/agc_only.liq"
description = "Song-level: release 0.3 dB/s, 6 dB window at 0.05 dB/s, 30 s detector, attack 1 dB/s."
[params]
target = -18.0
idle = 0.0
window = 6.0
release_rate = 0.3
window_rate = 0.05
window_s = 30.0
attack_rate = 1.0
[gauge_limits]
agc_gain = [-10.0, 10.0]
[level_check]
gauge = "agc_gain"
target_lufs = -18.0
