# Harness check: one acompressor at FFmpeg's default detection (rms, average link); the
# 3a fits must return the [model] values.
id = "check-acomp-rms"
version = 1
backend = "liquidsoap"
chain = "../../chains/acompressor.liq"
description = "3a fit check: acompressor, rms detection."
[params]
threshold_db = -24.0
ratio = 4.0
knee_db = 9.03
makeup_db = 6.0
attack_ms = 20.0
release_ms = 250.0
detection = 1
link = 0
[model]
kind = "acompressor"
threshold_db = -24.0
ratio = 4.0
knee_db = 9.03
makeup_db = 6.0
attack_ms = 20.0
release_ms = 250.0
detection = "rms"
link = "average"
