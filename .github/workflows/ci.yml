name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy backend --strict

  test:
    name: Test (pytest + branch coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retrostation
          POSTGRES_PASSWORD: retrostation-dev
          POSTGRES_DB: retrostation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrostation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retrostation:retrostation-dev@localhost:5432/retrostation_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      # A handful of tests (e.g. tests/services/test_scan_progress.py) mock the
      # psycopg import on their task module but the task calls connect_sync()
      # against settings.database_url, which is the un-suffixed base DB that
      # per-worker fixtures never migrate. Apply migrations once here so those
      # leaky tests see the schema the way local dev implicitly does.
      - name: Migrate base test database
        run: |
          uv run python -c "
          import psycopg
          from backend.db.migrations import run_migrations
          with psycopg.connect('${{ env.DATABASE_URL }}') as conn:
              run_migrations(conn)
              conn.commit()
          "
      - run: uv run pytest --cov=backend --cov-branch --cov-fail-under=80
