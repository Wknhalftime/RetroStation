name: CI

on:
  pull_request:
    branches: [master, feat/artist-model]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run poe events-check

  lint-proposed:
    # Rules the audit proposes but nobody has ruled on yet: report, never block.
    # Adopting a rule moves it into [tool.ruff.lint] select / [tool.mypy] and out of here.
    name: Proposed rules (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run poe lint-proposed
      - run: uv run poe types
        continue-on-error: true

  typecheck:
    name: Typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run mypy backend --strict

  test:
    name: Test (pytest + branch coverage)
    # 24.04: its archive ships the PostgreSQL 16 client tools the gate's clone tests need for
    # the pg16 service (ubuntu-latest, 26.04, ships only newer ones).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retrostation
          POSTGRES_PASSWORD: retrostation-dev
          POSTGRES_DB: retrostation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrostation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://retrostation:retrostation-dev@localhost:5432/retrostation_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras
      # The gate's clone tests dump and restore the pg16 service: they need the 16 client
      # tools, which scripts/gate.py picks from /usr/lib/postgresql/16/bin (a newer pg_dump
      # writes settings a 16 server refuses on restore). The 24.04 image may already hold them.
      - name: PostgreSQL 16 client tools
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
      - run: uv run pytest --cov=backend --cov-branch --cov-fail-under=80

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
